[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-arch-toolkit"
version = "0.1.0"
description = "Lightweight unified LLM client for OpenAI, Anthropic, xAI, and Gemini"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all = [
    "ai-arch-toolkit[anthropic]",
    "ai-arch-toolkit[openai]",
    "ai-arch-toolkit[gemini]",
    "ai-arch-toolkit[xai]",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "xai-sdk>=1.7.0",
]
docs = ["mkdocs>=1.6", "pdoc>=15.0"]
telemetry = ["opentelemetry-api>=1.27"]
xai = [
    "xai-sdk>=1.7.0",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
