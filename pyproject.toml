[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-arch-toolkit"
version = "0.1.0"
description = "Lightweight unified LLM client for OpenAI, Anthropic, xAI, and Gemini"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# Provider SDKs — install the one matching the model you plan to call.
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.50"]
xai = ["xai-sdk>=1.7.0"]

# Optional features.
graph = ["networkx>=3.0"]
tokens = ["tiktoken>=0.7"]
yaml = ["pyyaml>=6.0"]

# Aggregate: install every provider plus every optional feature.
all = [
    "ai-arch-toolkit[anthropic]",
    "ai-arch-toolkit[gemini]",
    "ai-arch-toolkit[graph]",
    "ai-arch-toolkit[openai]",
    "ai-arch-toolkit[tokens]",
    "ai-arch-toolkit[xai]",
    "ai-arch-toolkit[yaml]",
]
# Downstream consumers / tooling.
app = ["reflex>=0.7", "ai-arch-toolkit[graph,yaml]"]
bench = ["inspect-ai", "inspect-evals"]
docs = ["mkdocs>=1.6", "pdoc>=15.0"]
telemetry = ["opentelemetry-api>=1.27"]

# Local development — pulls in test runners, lint, and all providers/features.
dev = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "networkx>=3.0",
    "openai>=1.50",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "ruff>=0.9",
    "tiktoken>=0.7",
    "xai-sdk>=1.7.0",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require API keys)",
    "timeout: set test timeout in seconds",
]
