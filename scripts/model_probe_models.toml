# Manual live model probe inventory.
#
# Run with:
#   set -a; source .env; set +a
#   uv run python scripts/probe_models.py --suite smoke
#
# Scenarios:
#   plain, tools_loop, structured, json_mode, stream, thinking

# ---------------------------------------------------------------------------
# OpenAI
# ---------------------------------------------------------------------------

# Astra tool calling requires Responses; this adapter uses Chat Completions.
[[models]]
id = "gpt-6-astra"
provider = "openai"
scenarios = ["plain", "structured", "json_mode", "stream", "thinking"]
kwargs = { max_tokens = 4096, thinking_effort = "low" }

[[models]]
id = "gpt-5.5"
provider = "openai"
scenarios = ["plain", "tools_loop", "structured", "json_mode", "stream", "thinking"]
kwargs = { temperature = 1.0, max_tokens = 64, thinking_effort = "low" }

