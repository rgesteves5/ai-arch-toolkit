# Default pricing table — USD per 1M tokens
# Last updated: 2026-08-29 (verified against each provider's official catalog);
# Meta Muse Spark added 2026-09-13; Claude Opus 5.5, GPT-6 Sol and Luna, and Grok 4.7 added
# 2026-09-25; GPT-6.1 Sol added 2026-10-01; image models (GPT Image, Gemini image, Grok
# Imagine, Muse Image) added 2026-10-03; dated promotions and DeepSeek, Mistral and Poolside added
# 2026-10-04.
# Override with: pricing.load("your_file.toml") or pricing.register(...)
# Keys are exact model ids. A dated snapshot (-20251001, -2024-08-06, @20251101, -0709, -001,
# -latest) takes the price of the id it snapshots, unless it has an entry of its own. `aliases`
# lists other ids billed at the same rates; a variant (o3-pro, gpt-4o-audio-preview) is another
# model and has no price until it gets an entry. `match = "prefix"` is an explicit opt-in.
# Known simplifications: cache_write uses Anthropic's 5-min TTL tier (1.25x input) —
# the 1-hour tier (2x input) can be overridden via pricing.register().

