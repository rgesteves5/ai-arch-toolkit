# Default pricing table — USD per 1M tokens
# Last updated: 2026-07-26 (verified against each provider's live model list)
# Override with: pricing.load("your_file.toml") or pricing.register(...)
# Known simplifications: cache_write uses Anthropic's 5-min TTL tier (1.25x input) —
# the 1-hour tier (2x input) can be overridden via pricing.register(); tiered
# cached-input rates on long prompts (xAI, Gemini) are not modeled — cache_read
# uses the base tier.

# ═══════════════════════════════════════════════════════════════════
# Anthropic Claude
# Source: https://platform.claude.com/docs/en/pricing
# Retired families (Claude 3.x, Claude 4.0) are intentionally absent — the API
# returns 404 for them.
# ═══════════════════════════════════════════════════════════════════

# ── Claude 5 ──

# Opus 5, Sonnet 5, and Fable/Mythos 5 ship with full 1M context at standard
# pricing (no long-context tier). Fast mode (Opus 5 only) is 2x standard rates.
[claude-fable-5]
input = 10.0
output = 50.0
cache_write = 12.50
cache_read = 1.0
batch_input = 5.0
batch_output = 25.0

# Same model and pricing as Fable 5, distributed through Project Glasswing.
[claude-mythos-5]
input = 10.0
output = 50.0
cache_write = 12.50
cache_read = 1.0
batch_input = 5.0
batch_output = 25.0

[claude-opus-5]
input = 5.0
output = 25.0
cache_write = 6.25
cache_read = 0.50
batch_input = 2.50
batch_output = 12.50
fast_input = 10.0
fast_output = 50.0

# List price; an introductory $2/$10 rate applies through 2026-08-31.
[claude-sonnet-5]
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.30
batch_input = 1.50
batch_output = 7.50

