# Default model catalog — what each provider publishes about its models (C06, D63).
#
# Only what the adapter does not know: the published limits (context window, input and output
# tokens, as each provider gives them) and modalities, each with the page it was read from and
# the day. What the adapter does with a model (tools, tool choices, reasoning, server tools)
# comes from the adapter's own tables (`model_facts`), never from here.
#
# The seed is the current line with an official page (C06.6): the 30 models of the probe
# inventory (scripts/model_probe_models.toml) still served, and the image models (C06.7). A fact
# a page does not state is left out (unknown, never "no"). Read on 2026-10-08.
#
# Keys are the provider's own ids; a dated snapshot finds its entry without an alias. `aliases`
# lists other fixed ids of the same model; a `-latest` pointer, which moves, never is one.
# Override with model_catalog.load("your_file.toml") or model_catalog.register(...).
catalog_version = 1

# ═══════════════════════════════════════════════════════════════════
# Anthropic
# Limits: each model's page ("1M tokens" is 1,000,000; "128K tokens" 128,000). Inputs: the model
# page ("Text and images → text") and the PDF page ("All active models support PDF
# processing"). Max output is the synchronous Messages API limit; a beta header raises it on
# batches, which the catalog does not model.
# ═══════════════════════════════════════════════════════════════════

[anthropic."claude-opus-5-5"]
context_window = 1_000_000
output_token_limit = 128_000
input_modalities = ["text", "image", "pdf"]
output_modalities = ["text"]
