name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check src tests examples
      - name: ruff format --check
        run: uv run ruff format --check src tests examples

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run pyright src

  test:
    name: Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      # live_api tests call paid provider APIs; they only run locally, never in CI.
      - run: uv run pytest -m "not live_api" --cov=ai_arch_toolkit --cov-report=term-missing

  floors:
    name: Test — lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Installs the lowest version of every direct dependency, so the floors declared in
      # pyproject.toml are versions the suite has actually run against.
      - run: uv sync --extra dev --resolution lowest-direct
      - run: uv run --no-sync pytest -m "not live_api"
