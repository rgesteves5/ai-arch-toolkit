name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check src tests examples
      - name: ruff format --check
        run: uv run ruff format --check src tests examples

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run pyright src

  test:
    name: Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest --cov=ai_arch_toolkit --cov-report=term-missing

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: uv build
      - name: Smoke minimal wheel install
        run: |
          WHEEL="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          cd /tmp
          uv run --no-project --with "$WHEEL" -- python -c "import importlib.util; import ai_arch_toolkit; from ai_arch_toolkit.core import pricing; assert pricing.has('gpt-4o'); assert importlib.util.find_spec('openai') is None"
      - name: Smoke optional extras
        run: |
          WHEEL="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          URI="file://${WHEEL}"
          cd /tmp
          uv run --no-project --with "ai-arch-toolkit[openai] @ ${URI}" -- python -c "from ai_arch_toolkit.core._providers._openai import OpenAIProvider; assert OpenAIProvider is not None"
          uv run --no-project --with "ai-arch-toolkit[anthropic] @ ${URI}" -- python -c "from ai_arch_toolkit.core._providers._anthropic import AnthropicProvider; assert AnthropicProvider is not None"
          uv run --no-project --with "ai-arch-toolkit[gemini] @ ${URI}" -- python -c "from ai_arch_toolkit.core._providers._gemini import GeminiProvider; assert GeminiProvider is not None"
          uv run --no-project --with "ai-arch-toolkit[xai] @ ${URI}" -- python -c "from ai_arch_toolkit.core._providers._xai import XAIProvider; assert XAIProvider is not None"
          uv run --no-project --with "ai-arch-toolkit[graph] @ ${URI}" -- python -c "from ai_arch_toolkit.core.graph._networkx import NetworkXBackend; assert NetworkXBackend is not None"
          uv run --no-project --with "ai-arch-toolkit[all] @ ${URI}" -- python -c "import ai_arch_toolkit; from ai_arch_toolkit.core.graph._networkx import NetworkXBackend; assert ai_arch_toolkit.__version__; assert NetworkXBackend is not None"
