name: Integration

# Run live-API end-to-end tests against the real provider SDKs. These calls
# cost money (a few cents per run with gpt-4.1-nano) and require an API key,
# so they are *not* part of the default CI. Trigger manually from the Actions
# tab or wait for the daily schedule.
on:
  workflow_dispatch:
  schedule:
    # 06:17 UTC daily — well outside business hours in EU/US.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: End-to-end (OpenAI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on forks — they won't have the secret.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'rgesteves5/ai-arch-toolkit'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Run integration tests
        run: uv run pytest -m integration -v
